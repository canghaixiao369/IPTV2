name: Update

on:
  push:
  schedule:
    - cron: 0,30 * * * *

env:
  TZ: Asia/henan

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: GetTime
      run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

    - name: Update
      run: |
        # 央视源
        rm -f CCTV.txt && wget http://jianhan.vip/yzt91220/幻影直播.txt -O CCTV.txt
        sed -i -n '/央视频道/,+1p' CCTV.txt
        sed -i '' CCTV.txt
        sed -i '/^\s*$/d' CCTV.txt

        # 卫视源
        rm -f CNTV.txt && touch CNTV.txt
        wget http://jianhan.vip/yzt91220/幻影直播.txt -O CNTV1.txt && sed -i -n '/卫视频道/,+1p' CNTV1.txt
        wget https://idc.weyun.site/iptv/iptv.txt -O CNTV2.txt && sed -i -n '/河南/,+1p' CNTV2.txt
        wget https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u -O CNTV3.txt && sed -i -n '/电影/,+1p' CNTV3.txt
        cat CNTV1.txt >> CNTV.txt
        cat CNTV2.txt >> CNTV.txt
        cat CNTV3.txt >> CNTV.txt
        rm -f CNTV1.txt CNTV2.txt CNTV3.txt
        sed -i '' CNTV.txt
        sed -i '/^\s*$/d' CNTV.txt

        # 成人源
        rm -f Adult.m3u && wget http://adultiptv.net/chs.m3u -O Adult.m3u
        sed -i -n '/XXX/,+1p' Adult.m3u
        sed -i 's/XXX/成人频道/' Adult.m3u
        sed -i 's/AdultIPTV.net //g' Adult.m3u
        # wget https://raw.githubusercontent.com/YanG-1989/m3u/main/Adult.m3u -O AdultVideo.txt
        # sed -i -n '/日本/,+1p' AdultVideo.txt
        # sed -i 's/日本/成人视频/' AdultVideo.txt
        # echo '' >> Adult.m3u && cat AdultVideo.txt >> Adult.m3u
        # rm -f AdultVideo.txt
        sed -i '/^\s*$/d' Adult.m3u

        # 整合源
        rm -f IPTV.m3u && touch IPTV.m3u
        cat CCTV.m3u >> IPTV.m3u
        cat CNTV.m3u >> IPTV.m3u
        cat Adult.m3u >> IPTV.m3u
        sed -i '/#EXTM3U/d' IPTV.m3u
        sed -i '1i #EXTM3U' IPTV.m3u
        sed -i '/^\s*$/d' IPTV.m3u

        # 节目源
        rm -f EPG.xml && wget https://epg.112114.xyz/pp.xml -O EPG.xml
        echo "Auto Update IPTV in ${GET_TIME}" > README.md

    - name: Clean
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout --orphan latest_branch
        git add -A
        git commit -am "${GET_TIME}"
        git branch -D Files
        git branch -m Files

    - name: Push
      run: git push -f origin Files
